<title>ELToobb | أحزمة وبوكسرات</title>
<meta name="color-scheme" content="light">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"></noscript>
<style>
:root{--red:#d7131c;--red-d:#a30c13;--ink:#17171b;--muted:#6c7078;--bg:#f4f4f5;--line:#e7e7ea;--r:14px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;background:#f4f4f5;color-scheme:light}
body{font-family:'Cairo','Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;padding-bottom:76px}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
img{display:block;max-width:100%}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s16{width:16px;height:16px}
svg.i.s34{width:34px;height:34px;stroke-width:1.7}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}

/* ===== Header ===== */
.top{background:#fff;position:sticky;top:0;z-index:60;box-shadow:0 1px 0 var(--line)}
.top-in{direction:ltr;display:flex;align-items:center;gap:14px;height:64px}
.menu-btn{display:grid;place-items:center;width:40px;height:40px}
.logo{display:flex;flex-direction:column;align-items:center;line-height:1;position:relative;padding-top:8px;direction:ltr}
.logo svg{position:absolute;top:-4px;left:2px;width:18px;height:18px;fill:var(--red)}
.logo b{font-style:italic;font-weight:900;font-size:27px;letter-spacing:-.5px;color:#111}
.logo em{align-self:flex-end;font-style:italic;font-weight:800;font-size:15px;color:var(--red);margin-top:-4px}
.top-in .logo{margin:0 auto}
.search{display:none;direction:rtl;flex:1;max-width:480px;margin:0 auto;border:1.5px solid var(--line);border-radius:99px;align-items:center;padding:0 14px;height:44px;background:#fff}
.search input{flex:1;border:0;outline:0;background:none;padding:0 8px;font-size:14px}
.search button{display:grid;place-items:center}
.search:focus-within{border-color:var(--red)}
.acts{display:flex;gap:6px;direction:ltr}
.act{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;font-weight:700;position:relative;min-width:44px;padding:4px 6px}
.act span{display:none}
.act.dsk{display:none}
.badge{position:absolute;top:0;right:4px;min-width:17px;height:17px;border-radius:99px;background:var(--red);color:#fff;font-size:10px;font-weight:800;font-style:normal;display:grid;place-items:center;padding:0 4px;line-height:1}
.badge[hidden]{display:none}
.msearch{display:none;background:#fff;padding:0 16px 12px}
.msearch.show{display:block}
.msearch .search{display:flex;max-width:none}
.navbar{display:none;background:var(--red)}
.navbar .wrap{display:flex;justify-content:center;align-items:center;gap:6px;height:40px}
.navbar a{color:#fff;font-weight:700;font-size:14px;padding:3px 28px;border-radius:8px}
.navbar a.active{background:var(--ink)}

.logo.has-img{padding:0}
.logo-img{height:56px;width:56px;object-fit:contain;display:block}
.logo.big .logo-img{height:110px;width:110px}
@media(min-width:900px){.logo-img{height:66px;width:66px}}

/* drawer */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;visibility:hidden;transition:.25s;z-index:80}
.ov.open{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;bottom:0;left:0;width:270px;background:#fff;z-index:90;transform:translateX(-100%);transition:.28s;padding:22px 18px;display:flex;flex-direction:column;gap:6px}
.drawer.open{transform:none}
.drawer .logo{margin:0 auto 18px}
.drawer a{padding:12px 14px;border-radius:10px;font-weight:700;display:flex;gap:10px;align-items:center}
.drawer a.active{background:var(--red);color:#fff}

/* ===== Home ===== */
.hero-grid{display:grid;gap:14px;margin-top:14px;grid-template-columns:1fr;grid-template-areas:"hero" "feat"}
.feats{grid-area:feat;display:grid;gap:10px;grid-template-columns:repeat(3,1fr)}
.feat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 6px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.feat .ic{color:var(--red)}
.feat b{display:block;font-size:12.5px;font-weight:800;line-height:1.3}
.feat span{font-size:11px;color:var(--muted)}
.hero{grid-area:hero;position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);height:440px;background:linear-gradient(135deg,#fff 40%,#fbe7e8)}
.slide{position:absolute;inset:0;display:grid;grid-template-rows:52% 48%;opacity:0;visibility:hidden;transition:opacity .6s}
.slide.on{opacity:1;visibility:visible}
.slide .pic{order:-1;position:relative;min-height:0;overflow:hidden}
.slide .pic img{position:absolute;inset:10px 10px 0;width:calc(100% - 20px);height:calc(100% - 10px);max-width:none;object-fit:contain;mix-blend-mode:multiply}
.slide .txt{padding:6px 22px 34px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
.slide h1{font-size:clamp(28px,7vw,46px);font-weight:900;line-height:1.2}
.slide h1 em{display:block;font-style:normal;color:var(--red)}
.slide p{font-weight:700;color:#333;margin:6px 0 14px;font-size:15px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--red);color:#fff;font-weight:800;border-radius:10px;padding:10px 22px;font-size:15px;transition:.2s}
.btn:hover,.btn:active{background:var(--red-d)}
.dots{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:7px;z-index:3}
.dots button{width:9px;height:9px;border-radius:50%;background:#cfcfd4;transition:.2s}
.dots button.on{background:var(--red);width:22px;border-radius:9px}

h2.sec{display:flex;align-items:center;gap:14px;font-size:21px;font-weight:900;margin:26px 0 14px}
h2.sec::after{content:"";flex:1;height:2px;background:linear-gradient(to left,var(--red),var(--line))}
.cats{display:grid;gap:14px;grid-template-columns:1fr}
.cat{position:relative;height:170px;border-radius:var(--r);overflow:hidden;background:linear-gradient(270deg,#8e0a10,#d7131c 55%,#e8363d);display:flex;align-items:center;padding:0 26px;color:#fff}
.cat img{position:absolute;left:0;top:0;height:100%;width:60%;object-fit:cover;mix-blend-mode:multiply}
.cat .t{position:relative;z-index:2}
.cat h3{font-size:28px;font-weight:900;margin-bottom:8px}
.cat .pill{display:inline-flex;align-items:center;gap:8px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.4);padding:7px 18px;border-radius:9px;font-weight:700;font-size:14px}

/* ===== Products ===== */
.grid{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px;position:relative;display:flex;flex-direction:column;overflow:hidden;transition:box-shadow .2s,transform .2s}
.card:hover{box-shadow:0 8px 22px rgba(0,0,0,.09);transform:translateY(-2px)}
.card .im{aspect-ratio:1;background:#fff;border-radius:10px;display:grid;place-items:center;overflow:hidden}
.card .im img{width:100%;height:100%;object-fit:contain}
.card h3{font-size:14px;font-weight:700;text-align:center;margin-top:6px}
.card .pr{color:var(--red);font-weight:800;text-align:center;font-size:16px}
.add{margin-top:8px;background:var(--red);color:#fff;border-radius:8px;padding:8px;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s}
.add:active{background:var(--red-d);transform:scale(.98)}
.fav{position:absolute;top:8px;right:8px;z-index:2;width:32px;height:32px;display:grid;place-items:center;color:#8a8d94}
.fav svg{width:20px;height:20px}
.fav.on{color:var(--red)}
.fav.on svg{fill:var(--red)}
.card.ft .fav{right:auto;left:8px}
.tag{position:absolute;top:0;right:0;z-index:2;background:var(--red);color:#fff;font-size:11px;font-weight:800;padding:2px 14px 3px 12px;border-radius:0 0 0 10px}

.banner{margin-top:14px;position:relative;height:130px;border-radius:var(--r);overflow:hidden;background:linear-gradient(270deg,#8e0a10,#d7131c 55%,#e8363d);color:#fff;display:flex;align-items:center;padding:0 22px}
.banner img{position:absolute;left:0;top:0;height:100%;width:58%;object-fit:cover;mix-blend-mode:multiply}
.banner .t{position:relative;z-index:2}
.banner h1{font-size:30px;font-weight:900;line-height:1.2}
.banner p{font-size:14px;opacity:.95}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:7px 16px;border-radius:99px;border:1px solid var(--line);background:#fff;white-space:nowrap;font-size:13px;font-weight:700}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.page-grid{margin-top:12px}
.empty{background:#fff;border:1px dashed #d8d8dc;border-radius:var(--r);padding:44px 16px;text-align:center;color:var(--muted)}
.empty svg{width:46px;height:46px;color:var(--red);margin:0 auto 10px;display:block}
.empty .btn{margin-top:14px}

/* ===== Cart ===== */
.narrow{max-width:760px;margin:0 auto}
.ptitle{display:flex;align-items:center;gap:10px;margin:16px 0 12px;font-size:21px;font-weight:900}
.ptitle a{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:#fff;border:1px solid var(--line)}
.crow{direction:ltr;display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin-bottom:12px}
.crow img{width:92px;height:92px;object-fit:contain;border-radius:10px;background:#fff;flex:none}
.cinfo{flex:1;direction:rtl;text-align:left}
.cinfo b{display:block;font-weight:800;font-size:15px}
.cinfo .p{color:var(--red);font-weight:800;margin:2px 0 6px}
.qty{direction:ltr;display:inline-flex;align-items:center;gap:10px}
.qty button{width:28px;height:28px;border:1.5px solid #cfd0d5;border-radius:7px;display:grid;place-items:center}
.qty button:active{border-color:var(--red);color:var(--red)}
.qty span{min-width:18px;text-align:center;font-weight:800}
.del{color:var(--red);width:38px;height:38px;display:grid;place-items:center}
.sum{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:6px}
.sum div{display:flex;justify-content:space-between;padding:6px 0;color:#444;font-weight:600}
.sum .tot{border-top:1px solid var(--line);margin-top:6px;padding-top:12px;color:var(--red);font-weight:900;font-size:18px}
.wa{width:100%;margin-top:14px;justify-content:center;padding:15px;font-size:16px;border-radius:12px}

/* ===== Login ===== */
.auth-wrap{position:relative;padding:10px 0 20px}
.auth-wrap::before{content:"";position:absolute;top:-10px;right:-16px;width:140px;height:170px;background:linear-gradient(200deg,var(--red),#ff6a70 60%,transparent 61%);clip-path:polygon(100% 0,0 0,100% 100%);opacity:.9;pointer-events:none}
.auth{max-width:420px;margin:18px auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px 22px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.06);position:relative}
.avatar{width:62px;height:62px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;margin:0 auto 10px}
.avatar svg{width:32px;height:32px}
.auth h1{font-size:24px;font-weight:900}
.auth .sub{font-size:13px;color:var(--muted);margin-bottom:6px}
.field{position:relative;margin-top:12px}
.field input{width:100%;height:52px;border:1.5px solid var(--line);border-radius:12px;padding:0 16px 0 46px;outline:0;background:#fff;font-size:14px}
.field input:focus{border-color:var(--red)}
.field .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#555;display:grid}
.auth .btn{width:100%;justify-content:center;margin-top:14px;padding:13px;font-size:17px;border-radius:12px}
.link{color:var(--red);font-weight:700;font-size:13px;display:inline-block;margin-top:10px}
.or{display:flex;align-items:center;gap:10px;color:#999;font-size:13px;margin:12px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.gbtn{width:100%;height:50px;border:1.5px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:14px}
.gbtn svg{width:20px;height:20px}
.auth .foot{margin-top:14px;font-size:13px;color:#555}
.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.ghost:hover{background:#f4f4f5}

/* ===== Footer / bottom nav / toast ===== */
footer{background:var(--ink);color:#d7d7db;margin-top:34px;padding:26px 0 22px;text-align:center;font-size:14px}
footer b{color:#fff;font-size:18px;display:block;margin-bottom:6px}
footer a.num{color:#fff;font-weight:800;direction:ltr;display:inline-block;margin-top:4px}
footer small{display:block;margin-top:12px;opacity:.6}
.bnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:70;padding-bottom:env(safe-area-inset-bottom,0)}
.bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:11px;font-weight:700;color:#444;position:relative}
.bnav a.active{color:var(--red)}
.bnav .badge{right:calc(50% - 20px)}
#toast{position:fixed;bottom:90px;left:50%;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 20px;border-radius:99px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:120;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ===== Desktop ===== */
@media(min-width:700px){
  .grid{grid-template-columns:repeat(3,1fr);gap:16px}
  .cats{grid-template-columns:1fr 1fr}
}
@media(min-width:900px){
  body{padding-bottom:0}
  .bnav,.menu-btn,.msearch,.act.mob{display:none!important}
  .top-in{height:78px;gap:20px}
  .top-in .logo{margin:0}
  .logo b{font-size:32px}
  .search{display:flex}
  .act{min-width:60px}
  .act span{display:block}
  .act.dsk{display:flex}
  .badge{right:12px}
  .navbar{display:block}
  .hero-grid{grid-template-columns:250px 1fr;grid-template-areas:"feat hero"}
  .feats{grid-template-columns:1fr;grid-template-rows:repeat(3,1fr)}
  .feat{flex-direction:row;text-align:right;padding:14px 16px;gap:14px}
  .feat b{font-size:15px}.feat span{font-size:12.5px}
  .hero{height:400px}
  .slide{grid-template-rows:1fr;grid-template-columns:1fr 1.1fr}
  .slide .pic{order:0}
  .slide .pic img{inset:16px;width:calc(100% - 32px);height:calc(100% - 32px)}
  .slide .txt{padding:20px 40px}
  .cat{height:190px}
  .banner{height:200px;padding:0 50px}
  .banner h1{font-size:44px}.banner p{font-size:17px}
  .grid{grid-template-columns:repeat(4,1fr)}
  #toast{bottom:30px}
}

/* ---------- حالة السلة والمفضلة ---------- */
const cartCount = () => Object.values(cart).reduce((a, b) => a + b, 0);
const cartSub   = () => Object.entries(cart).reduce((s, [id, q]) => s + (byId(id)?.price || 0) * q, 0);

function save(){ store.set('et_cart', cart); store.set('et_favs', favs); updateChrome(); }
function addToCart(id){ cart[id] = (cart[id] || 0) + 1; save(); toast('تمت الإضافة إلى السلة ✓'); }
function setQty(id, d){ cart[id] = (cart[id] || 0) + d; if (cart[id] <= 0) delete cart[id]; save(); render(true); }
function removeItem(id){ delete cart[id]; save(); render(true); }
function toggleFav(id, btn){
  const i = favs.indexOf(id);
  if (i > -1) favs.splice(i, 1); else favs.push(id);
  save();
  if (currentPage() === 'favorites') render(true);
  else $$(`.fav[data-id="${id}"]`).forEach(b => b.classList.toggle('on', favs.includes(id)));
}

function updateChrome(){
  const set = (k, n) => $$(`[data-b="${k}"]`).forEach(b => { b.textContent = n; b.hidden = !n; });
  set('cart', cartCount()); set('fav', favs.length);
  $('#acc-label').textContent = user ? 'حسابي' : 'تسجيل الدخول';
}

let toastT;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3500);
}

/* ---------- واتساب ---------- */
const waLink = text => `https://wa.me/${WA_NUMBER}${text ? '?text=' + encodeURIComponent(text) : ''}`;
// موبايل: يفتح تطبيق واتساب مباشرة في نفس الصفحة — كمبيوتر: تبويب جديد
function openWA(url){
  const a = document.createElement('a');
  a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer';
  document.body.appendChild(a); a.click(); a.remove();
}
function checkout(){
  const items = Object.entries(cart).map(([id, q]) => ({ p: byId(id), q })).filter(x => x.p);
  if (!items.length) return toast('السلة فاضية');
  const sub = cartSub();
  let msg = 'مرحباً ELToobb 👋\nعايز أطلب:\n\n';
  items.forEach((x, i) => msg += `${i + 1}) ${x.p.name} × ${x.q} = ${x.p.price * x.q} ج\n`);
  msg += `\nإجمالي المنتجات: ${sub} ج\nرسوم التوصيل: ${SHIPPING} ج\nالإجمالي الكلي: ${sub + SHIPPING} ج\n\nالاسم:\nالعنوان:\nرقم الموبايل:`;
  openWA(waLink(msg));
}

/* ---------- القوالب ---------- */
function card(p, ft = false){
  return `<article class="card${ft ? ' ft' : ''}">
    ${ft ? '<span class="tag">جديد</span>' : ''}
    <button class="fav${favs.includes(p.id) ? ' on' : ''}" data-act="fav" data-id="${p.id}" aria-label="أضف للمفضلة">${ic('heart')}</button>
    <div class="im"><img src="${img(p.img)}" alt="${esc(p.name)}" loading="lazy"></div>
    <h3>${esc(p.name)}</h3>
    <div class="pr">${p.price} ج</div>
    <button class="add" data-act="add" data-id="${p.id}">${ic('cart', 's16')} أضف إلى السلة</button>
  </article>`;
}
const grid = (list, ft) => list.length
  ? `<div class="grid page-grid">${list.map(p => card(p, ft)).join('')}</div>`
  : '';
const emptyBox = (icon, text, btn = true) => `<div class="empty">${ic(icon)}<p>${text}</p>${btn ? '<a class="btn" href="#/home">تسوق الآن</a>' : ''}</div>`;

function catCard(type){
  const s = SECTIONS[type];
  return `<a class="cat" href="#/${type}"><img src="${img(s.img)}" alt=""><div class="t"><h3>${s.title}</h3><span class="pill">${ic('arrow', 's16')} تسوق الآن</span></div></a>`;
}

/* ---------- الصفحات ---------- */
function pageHome(){
  const slides = SLIDES.map((s, i) => `
    <div class="slide${i === 0 ? ' on' : ''}">
      <div class="pic"><img src="${img(s.img)}" alt=""></div>
      <div class="txt"><h1>${s.l1}<em>${s.l2}</em></h1><p>${s.p}</p><a class="btn" href="${s.to}">${ic('arrow', 's16')} تسوق الآن</a></div>
    </div>`).join('');
  const dots = SLIDES.map((_, i) => `<button class="${i === 0 ? 'on' : ''}" data-act="slide" data-i="${i}" aria-label="شريحة ${i + 1}"></button>`).join('');
  const featured = [...PRODUCTS.filter(p => p.type === 'belts').slice(0, 4), ...PRODUCTS.filter(p => p.type === 'boxers').slice(0, 4)];
  return `
  <section class="hero-grid">
    <div class="feats">
      <div class="feat"><span class="ic">${ic('truck', 's34')}</span><div><b>توصيل سريع</b><span>لجميع المحافظات</span></div></div>
      <div class="feat"><span class="ic">${ic('shield', 's34')}</span><div><b>جودة عالية</b><span>خامات مضمونة</span></div></div>
      <div class="feat"><span class="ic">${ic('headset', 's34')}</span><div><b>دعم العملاء</b><span>طوال الوقت</span></div></div>
    </div>
    <div class="hero">${slides}<div class="dots">${dots}</div></div>
  </section>
  <h2 class="sec">أقسام المتجر</h2>
  <div class="cats">${catCard('belts')}${catCard('boxers')}</div>
  <h2 class="sec">منتجات مميزة</h2>
  <div class="grid">${featured.map(p => card(p, true)).join('')}</div>`;
}

function pageSection(type){
  const s = SECTIONS[type];
  const f = filters[type];
  const list = PRODUCTS.filter(p => p.type === type && (f === 'all' || p.cat === f));
  return `
  <div class="banner"><img src="${img(s.img)}" alt=""><div class="t"><h1>${s.title}</h1><p>${s.sub}</p></div></div>
  <div class="chips">${s.filters.map(([k, label]) => `<button class="chip${f === k ? ' on' : ''}" data-act="filter" data-type="${type}" data-f="${k}">${label}</button>`).join('')}</div>
  ${grid(list) || emptyBox('cart', 'لا توجد منتجات في هذا التصنيف', false)}`;
}

function pageCategories(){
  return `<div class="ptitle">الأقسام</div><div class="cats">${catCard('belts')}${catCard('boxers')}</div>`;
}

function pageFavorites(){
  const list = favs.map(byId).filter(Boolean);
  return `<div class="ptitle">المفضلة</div>${grid(list) || emptyBox('heart', 'لسه مضفتش أي منتج للمفضلة')}`;
}

function pageSearch(q){
  const term = q.trim().toLowerCase();
  const list = PRODUCTS.filter(p => p.name.toLowerCase().includes(term));
  return `<div class="ptitle">نتائج البحث عن «${esc(q)}»</div>${grid(list) || emptyBox('cart', 'مفيش منتجات مطابقة للبحث')}`;
}

function pageCart(){
  const items = Object.entries(cart).map(([id, q]) => ({ p: byId(id), q })).filter(x => x.p);
  const head = `<div class="ptitle"><a href="javascript:history.length>1?history.back():(location.hash='#/home')" aria-label="رجوع">${ic('back')}</a>سلة المشتريات</div>`;
  if (!items.length) return `<div class="narrow">${head}${emptyBox('cart', 'السلة فاضية')}</div>`;
  const sub = cartSub();
  const rows = items.map(({ p, q }) => `
    <div class="crow">
      <img src="${img(p.img)}" alt="${esc(p.name)}">
      <div class="cinfo"><b>${esc(p.name)}</b><div class="p">${p.price} ج</div>
        <div class="qty"><button data-act="qty" data-id="${p.id}" data-d="1" aria-label="زيادة">${ic('plus', 's16')}</button><span>${q}</span><button data-act="qty" data-id="${p.id}" data-d="-1" aria-label="نقص">${ic('minus', 's16')}</button></div>
      </div>
      <button class="del" data-act="del" data-id="${p.id}" aria-label="حذف">${ic('trash')}</button>
    </div>`).join('');
  return `<div class="narrow">${head}${rows}
    <div class="sum">
      <div><span>إجمالي المنتجات</span><span>${sub} ج</span></div>
      <div><span>رسوم التوصيل</span><span>${SHIPPING} ج</span></div>
      <div class="tot"><span>الإجمالي الكلي</span><span>${sub + SHIPPING} ج</span></div>
    </div>
    <button class="btn wa" data-act="checkout">${ic('wa')} إتمام الطلب عبر واتساب</button>
  </div>`;
}

function pageLogin(){
  const head = `<div class="avatar">${ic('user')}</div>`;
  if (user) return `<div class="auth-wrap"><div class="auth">${head}
      <h1>أهلاً ${esc(user.name || '')}</h1><p class="sub">${esc(user.id)}</p>
      <a class="btn" href="#/cart">${ic('cart')} سلة المشتريات</a>
      <button class="btn ghost" data-act="logout">تسجيل الخروج</button></div></div>`;
  const reg = authMode === 'register';
  return `<div class="auth-wrap"><div class="auth">${head}
    <h1>${reg ? 'إنشاء حساب جديد' : 'تسجيل الدخول'}</h1>
    <p class="sub">${reg ? 'سجّل بياناتك لإنشاء حسابك' : 'ادخل بياناتك للمتابعة'}</p>
    ${reg ? `<div class="field"><input id="a-name" placeholder="الاسم" autocomplete="name"><span class="ico">${ic('user')}</span></div>` : ''}
    <div class="field"><input id="a-id" type="email" inputmode="email" placeholder="البريد الإلكتروني" autocomplete="email"><span class="ico">${ic('mail')}</span></div>
    <div class="field"><input id="a-pw" type="password" placeholder="كلمة المرور" autocomplete="${reg ? 'new-password' : 'current-password'}"><span class="ico" data-act="eye" style="cursor:pointer">${ic('eye')}</span></div>
    <button class="btn" data-act="auth">${reg ? 'إنشاء الحساب' : 'تسجيل الدخول'}</button>
    ${reg ? '' : '<a class="link" href="#" data-act="forgot">نسيت كلمة المرور؟</a>'}
    <div class="or">أو</div>
    <button class="gbtn" data-act="google">${GOOGLE} متابعة عبر جوجل</button>
    <p class="foot">${reg ? 'لديك حساب بالفعل؟' : 'ليس لديك حساب؟'} <a class="link" href="#" data-act="mode">${reg ? 'تسجيل الدخول' : 'إنشاء حساب جديد'}</a></p>
  </div></div>`;
}

/* ---------- الراوتر ---------- */
function currentPage(){ return (location.hash.replace('#/', '') || 'home').split('/')[0]; }

function render(keepScroll = false){
  const [page, arg] = (location.hash.replace('#/', '') || 'home').split('/');
  clearInterval(slideTimer);
  const y = window.scrollY;
  let html;
  switch (page){
    case 'belts': case 'boxers': html = pageSection(page); break;
    case 'cart': html = pageCart(); break;
    case 'login': html = pageLogin(); break;
    case 'favorites': html = pageFavorites(); break;
    case 'categories': html = pageCategories(); break;
    case 'search': html = pageSearch(decodeURIComponent(arg || '')); break;
    default: html = pageHome();
  }
  $('#app').innerHTML = html;
  const navKey = ['belts', 'boxers', 'cart', 'login', 'favorites', 'categories'].includes(page) ? page : (page === 'search' ? '' : 'home');
  $$('[data-nav]').forEach(a => a.classList.toggle('active', a.dataset.nav === navKey));
  closeDrawer();
  window.scrollTo(0, keepScroll ? y : 0);
  if (page === 'home' || page === '') startSlider();
  updateChrome();
}

/* ---------- السلايدر ---------- */
function showSlide(i){
  const s = $$('.slide'), d = $$('.dots button');
  if (!s.length) return;
  slideIdx = (i + s.length) % s.length;
  s.forEach((x, k) => x.classList.toggle('on', k === slideIdx));
  d.forEach((x, k) => x.classList.toggle('on', k === slideIdx));
}
function startSlider(){ slideIdx = 0; clearInterval(slideTimer); slideTimer = setInterval(() => showSlide(slideIdx + 1), 5000); }

/* ---------- القائمة الجانبية ---------- */
function closeDrawer(){ $('#drawer').classList.remove('open'); $('#ov').classList.remove('open'); }

/* ---------- الأحداث ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act, id = t.dataset.id;
  if (act !== 'slide' && t.tagName === 'A') e.preventDefault();
  switch (act){
    case 'add': addToCart(id); break;
    case 'fav': toggleFav(id); break;
    case 'qty': setQty(id, +t.dataset.d); break;
    case 'del': removeItem(id); break;
    case 'filter': filters[t.dataset.type] = t.dataset.f; render(true); break;
    case 'slide': showSlide(+t.dataset.i); startSlider(); break;
    case 'checkout': checkout(); break;
    case 'contact': openWA(waLink('مرحباً ELToobb 👋')); break;
    case 'menu': $('#drawer').classList.toggle('open'); $('#ov').classList.toggle('open'); break;
    case 'msearch': { const m = $('#msearch'); m.classList.toggle('show'); if (m.classList.contains('show')) m.querySelector('input').focus(); break; }
    case 'eye': {
      const i = $('#a-pw'); const show = i.type === 'password'; i.type = show ? 'text' : 'password';
      t.innerHTML = ic(show ? 'eyeoff' : 'eye'); break;
    }
    case 'mode': authMode = authMode === 'login' ? 'register' : 'login'; render(true); break;
    case 'forgot': {
      const idv = ($('#a-id')?.value || '').trim();
      if (window.ETAuth) window.ETAuth.reset(idv); else toast('الخدمة غير جاهزة، حدّث الصفحة');
      break;
    }
    case 'google': window.ETAuth ? window.ETAuth.google() : toast('الخدمة غير جاهزة، حدّث الصفحة'); break;
    case 'logout': window.ETAuth && window.ETAuth.logout(); break;
    case 'auth': {
      const idv = $('#a-id').value.trim(), pw = $('#a-pw').value, name = $('#a-name')?.value.trim();
      if (!idv || !pw) return toast('اكتب بياناتك أولاً');
      if (authMode === 'register' && (!name || pw.length < 6)) return toast('الاسم مطلوب وكلمة المرور 6 أحرف على الأقل');
      if (!window.ETAuth) return toast('الخدمة غير جاهزة، حدّث الصفحة');
      window.ETAuth[authMode === 'register' ? 'register' : 'login'](idv, pw, name);
      break;
    }
  }
});

document.addEventListener('submit', e => {
  const f = e.target.closest('.sform'); if (!f) return;
  e.preventDefault();
  const q = f.querySelector('input').value.trim();
  if (q){ $('#msearch').classList.remove('show'); location.hash = '#/search/' + encodeURIComponent(q); }
});

window.addEventListener('hashchange', () => render());
render();
</script>

  const fail = e => { console.error(e); toastMsg(ERR[e.code] || 'حصل خطأ، حاول تاني'); };

  A.onAuthStateChanged(auth, u => {
    // الحساب بيتعتبر مسجّل دخول بس لو الإيميل متفعّل (جوجل متفعّل تلقائيًا)
    const ok = u && u.emailVerified;
    window.setAuthUser(ok ? { id: u.email || u.uid, name: u.displayName || '', uid: u.uid } : null);
  });
  A.getRedirectResult(auth).catch(fail);

  window.ETAuth = {
    async register(idv, pw, name) {
      const email = toEmail(idv); if (!email) return toastMsg('اكتب بريد إلكتروني صحيح');
      try {
        const c = await A.createUserWithEmailAndPassword(auth, email, pw);
        await A.updateProfile(c.user, { displayName: name });
        await A.sendEmailVerification(c.user);
        await A.signOut(auth);
        toastMsg('بعتنالك رابط تفعيل على إيميلك، افتحه وبعدين سجّل دخول');
        authMode = 'login'; render(true);
      } catch (e) { fail(e); }
    },
    async login(idv, pw) {
      const email = toEmail(idv); if (!email) return toastMsg('اكتب بريد إلكتروني صحيح');
      try {
        const c = await A.signInWithEmailAndPassword(auth, email, pw);
        if (!c.user.emailVerified) {
          await A.sendEmailVerification(c.user).catch(() => {});
          await A.signOut(auth);
          return toastMsg('فعّل إيميلك الأول، بعتنالك الرابط تاني');
        }
        toastMsg('تم تسجيل الدخول ✓'); location.hash = '#/home';
      }
      catch (e) { fail(e); }
    },
    async google() {
      const prov = new A.GoogleAuthProvider();
      try { await A.signInWithPopup(auth, prov); toastMsg('تم تسجيل الدخول ✓'); location.hash = '#/home'; }
      catch (e) {
        if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') return A.signInWithRedirect(auth, prov);
        fail(e);
      }
    },
    async reset(idv) {
      if (!idv) return toastMsg('اكتب بريدك الإلكتروني الأول');
      if (!isEmail(idv)) return toastMsg('اكتب بريدك الإلكتروني صح');
      try { await A.sendPasswordResetEmail(auth, idv); toastMsg('بعتنالك رابط تغيير كلمة المرور على الإيميل'); }
      catch (e) { fail(e); }
    },
    async logout() { await A.signOut(auth); toastMsg('تم تسجيل الخروج'); }
  };
  }
}
</script>
</body>
</html>
